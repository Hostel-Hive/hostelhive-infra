name: hostelhive-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hostelhive}
      POSTGRES_DB: ${POSTGRES_DB:-hostelhive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    profiles: [backend]
    build:
      context: ${BACKEND_SOURCE:-../../HostelHive-Backend/hostelhive-backend}
      dockerfile_inline: |
        FROM golang:1.27.3-alpine AS build
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
        COPY cmd ./cmd
        COPY internal ./internal
        COPY docs ./docs
        RUN CGO_ENABLED=0 go build -trimpath -o /server ./cmd/server
        FROM alpine:3.22
        RUN apk add --no-cache ca-certificates tzdata && adduser -D -u 10001 app
        COPY --from=build /server /usr/local/bin/server
        USER app
        EXPOSE 18080
        ENTRYPOINT ["/usr/local/bin/server"]
    environment:
      APP_ENV: development
      HTTP_ADDR: 0.0.0.0:18080
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgres://hostelhive:REPLACE_WITH_LOCAL_PASSWORD@postgres:5432/hostelhive?sslmode=disable}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-your-firebase-project-id}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173}
      RTDB_ENABLED: "false"
      R2_ENABLED: "false"
      FCM_ENABLED: "false"
      STUDENT_INVITATIONS_ENABLED: "false"
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_FILE:-./secrets/firebase-service-account.json}
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:18080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
